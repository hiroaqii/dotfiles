# macOS uses the shared mise tools.
# Homebrew formula/cask definitions will be added after reviewing the Mac.

[bootstrap.repos]
# Upgrade Antidote deliberately by changing this release tag.
"~/.local/share/antidote" = { url = "https://github.com/mattmc3/antidote.git", ref = "v2.3.0" }

[dotfiles]
"~/.config/herdr/config.toml" = { source = "../config/macos/herdr/config.toml", mode = "symlink" }
"~/.config/zsh/plugins.txt" = { source = "../config/macos/zsh/plugins.txt", mode = "symlink" }
"~/.config/zsh/dotfiles.zsh" = { source = "../config/macos/zsh/dotfiles.zsh", mode = "symlink" }

"~/.config/zsh/completions.txt" = { source = "../config/macos/zsh/completions.txt", mode = "symlink" }
