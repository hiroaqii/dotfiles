# Replace inherited font families with the previous shared font selection.
font-family = ""
font-family = "UDEV Gothic 35NF"
font-family = "JetBrainsMono Nerd Font Mono"

# Keep programming symbols as separate glyphs.
font-feature = -dlig
font-feature = -calt
font-feature = -liga

theme = Nord Wave

# Keep the underline cursor at the shell prompt.
cursor-style = underline
cursor-style-blink = true
shell-integration-features = no-cursor,ssh-env,ssh-terminfo,sudo

# Replace inherited includes (including Omarchy's dynamic theme).
# Local settings are loaded last and may override these shared defaults.
config-file =
config-file = ?~/.config/ghostty/local.conf
